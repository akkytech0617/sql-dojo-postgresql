services:
  db:
    # Pinned to a minor release so every learner gets the same server; Dependabot proposes updates.
    image: postgres:18.6
    container_name: ${COMPOSE_PROJECT_NAME:-sql-dojo}-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dojo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dojo_admin_pw}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    # Learner SQL runs as a superuser, which can run shell commands inside this container
    # (COPY ... TO PROGRAM). Keep the container's own privileges as small as postgres allows.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 512
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
